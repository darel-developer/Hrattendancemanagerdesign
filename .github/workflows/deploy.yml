name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/jorel/hrmanager

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend deps
        run: npm install --include=dev

      - name: Build frontend
        env:
          VITE_API_URL: https://api.hrmanagerportal.duckdns.org
        run: npm run build

      - name: Install backend deps
        working-directory: ./server
        run: npm install --omit=dev

      - name: Backend syntax check
        working-directory: ./server
        run: node --check server.js

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,JWT_EXPIRES_IN,SUPER_ADMIN_PASSWORD,LOG_LEVEL,VITE_API_URL,ALLOWED_ORIGINS
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "→ Fetching latest code from main"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Writing runtime .env"
            umask 077
            cat > .env <<EOF
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_NAME=$DB_NAME
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=$JWT_EXPIRES_IN
            SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD
            LOG_LEVEL=$LOG_LEVEL
            VITE_API_URL=$VITE_API_URL
            ALLOWED_ORIGINS=$ALLOWED_ORIGINS
            EOF

            echo "→ Building containers"
            docker compose -f docker-compose.prod.yml build

            echo "→ Restarting services"
            docker compose -f docker-compose.prod.yml up -d

            echo "→ Pruning old images"
            docker image prune -f

            echo "✓ Deployment complete"
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

      - name: Smoke test API
        run: |
          sleep 25
          curl -fsS --retry 6 --retry-delay 5 https://api.hrmanagerportal.duckdns.org/api/health
